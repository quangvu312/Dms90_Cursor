name: Deploy to Vercel Production

# Build & deploy bằng Vercel token → không phụ thuộc Git Integration,
# nên mọi member push main đều deploy được (không bị chặn "not a member").
# ORG/PROJECT ID lấy từ GitHub Secrets — không hardcode project/team cũ.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Xóa .git để Vercel không đọc commit author → bỏ qua check
      # "contributing access" (Hobby Plan chặn author không thuộc team).
      - name: Strip git metadata
        run: rm -rf .git

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Fail sớm với message rõ nếu thiếu secret (tránh "Could not retrieve Project Settings").
      - name: Verify Vercel secrets
        run: |
          missing=0
          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "::error::VERCEL_ORG_ID secret is empty. Set repo secret from .vercel/project.json → orgId (sau npx vercel link)."
            missing=1
          fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::VERCEL_PROJECT_ID secret is empty. Set repo secret from .vercel/project.json → projectId (sau npx vercel link)."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "VERCEL_ORG_ID and VERCEL_PROJECT_ID are present (values not printed)."

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
