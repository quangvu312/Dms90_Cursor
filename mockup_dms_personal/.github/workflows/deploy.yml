name: Deploy to Vercel Production

# Build & deploy bằng Vercel token → không phụ thuộc Git Integration,
# nên mọi member push main đều deploy được (không bị chặn "not a member").
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_JOcpWf3l4J3LZYp7jvjnInPL
      VERCEL_PROJECT_ID: prj_F2TkEDRPoDuCDGFnF73Bmjtdj47O
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Xóa .git để Vercel không đọc commit author → bỏ qua check
      # "contributing access" (Hobby Plan chặn author không thuộc team).
      - name: Strip git metadata
        run: rm -rf .git

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
