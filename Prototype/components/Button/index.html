<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Button - Demo</title>
  <link rel="stylesheet" href="../../styles/theme.css" />
  <link rel="stylesheet" href="../../styles/button.css" />
</head>
<body style="padding:24px">
  <div id="demo"></div>
  <script src="../../scripts/component-core.js"></script>
  <script src="script.js"></script>
  <script>
    document.getElementById('demo').innerHTML = [
      DMS.render('Button', { text: 'Primary', type: 'primary' }),
      DMS.render('Button', { text: 'Default', type: 'default' }),
      DMS.render('Button', { text: 'Ghost', type: 'ghost' }),
      DMS.render('Button', { text: 'Link', type: 'link' })
    ].join(' ');
  </script>
</body>
</html>
